apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
    backstage.io/kubernetes-id: idp-cluster
  name: nginx
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  strategy: {}
  template:
    metadata:
      labels:
        backstage.io/kubernetes-id: idp-cluster
        app: nginx
    spec:
      containers:
        - image: nginx:1.28
          name: nginx
          resources: {}
