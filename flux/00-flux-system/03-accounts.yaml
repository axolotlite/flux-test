apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: accounts
  namespace: flux-system
spec:
  # ordering: apps (02) deploy only after infra (01) has reconciled
  dependsOn:
    - name: infra
      namespace: flux-system
  interval: 5m
  timeout: 3m
  # path is relative to the repo root, so it carries the flux/ prefix
  path: ./flux/03-accounts
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
